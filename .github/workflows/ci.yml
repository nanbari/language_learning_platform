name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, types et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Vérification des types (tsc)
        run: npm run typecheck

      - name: Tests unitaires (Vitest)
        run: npm test

  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build de production
        run: npm run build
        env:
          # Valeurs factices acceptées : les vraies clés ne sont nécessaires
          # qu'à l'exécution ; le build ne fait que les inliner.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

  access-matrix:
    name: Matrice d'accès HTTP (build de production)
    # Désactivée tant que la variable de dépôt ACCESS_MATRIX_ENABLED ne vaut pas
    # "true" : le script sonde un serveur `next start` relié à un projet Supabase
    # (de préférence un projet de TEST : secrets SUPABASE_* dédiés). Il n'envoie
    # que des lectures et des mutations refusées, avec des identités synthétiques.
    if: ${{ vars.ACCESS_MATRIX_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Build + démarrage + matrice
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          set -euo pipefail
          printf 'AUTH_SECRET=%s\n' "$AUTH_SECRET" > .env.local
          npm run build
          npx next start -p 3001 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3001/api/health > /dev/null && break; sleep 1; done
          node scripts/access-matrix.mjs http://localhost:3001 access-matrix-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: access-matrix-results
          path: access-matrix-results.json

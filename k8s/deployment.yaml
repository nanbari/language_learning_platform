apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: monte-et-souris
  labels:
    app: monte-et-souris
spec:
  replicas: 2
  selector:
    matchLabels:
      app: monte-et-souris
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: monte-et-souris
    spec:
      containers:
        - name: web
          # L'image est remplacée par la pipeline CD (kustomize edit set image)
          image: monte-et-souris:latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false

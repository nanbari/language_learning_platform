# Modèle — NE PAS committer de vraies valeurs.
# Créer le secret réel avec :
#   kubectl -n monte-et-souris create secret generic app-secrets \
#     --from-literal=AUTH_SECRET='<valeur aléatoire 32+ caractères>' \
#     --from-literal=SUPABASE_SERVICE_ROLE_KEY='<clé service-role Supabase>' \
#     --from-literal=NEXT_PUBLIC_SUPABASE_URL='https://xxxx.supabase.co' \
#     --from-literal=NEXT_PUBLIC_SUPABASE_ANON_KEY='<clé anon Supabase>' \
#     --from-literal=R2_ACCOUNT_ID='<id compte Cloudflare>' \
#     --from-literal=R2_ACCESS_KEY_ID='<clé API R2>' \
#     --from-literal=R2_SECRET_ACCESS_KEY='<secret API R2>' \
#     --from-literal=R2_BUCKET='monte-et-souris-media' \
#     --from-literal=R2_PUBLIC_BASE_URL='https://pub-xxxx.r2.dev'
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: monte-et-souris
type: Opaque
stringData:
  AUTH_SECRET: "CHANGE-ME"
  SUPABASE_SERVICE_ROLE_KEY: "CHANGE-ME"
  NEXT_PUBLIC_SUPABASE_URL: "https://CHANGE-ME.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "CHANGE-ME"
  R2_ACCOUNT_ID: "CHANGE-ME"
  R2_ACCESS_KEY_ID: "CHANGE-ME"
  R2_SECRET_ACCESS_KEY: "CHANGE-ME"
  R2_BUCKET: "monte-et-souris-media"
  R2_PUBLIC_BASE_URL: "https://pub-CHANGE-ME.r2.dev"
